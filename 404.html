<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Serial Tags LLC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;700&display=swap">
<style>
:root{--ink:#16181b;--on-dark:#eceae4;--muted:#9ea2a8;--line:#34383e;--accent:#e5703a;--accent-bg:#b0431a;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ink);color:var(--on-dark);font:16px/1.6 var(--sans);
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:96px 96px}
.box{max-width:520px;width:100%;border:1px solid var(--line);background:#23262b;padding:32px}
.code{font:600 13px/1 var(--mono);color:var(--accent);letter-spacing:.1em}
h1{margin:12px 0 8px;font:700 32px/1.15 var(--sans);color:#fff}
p{margin:0 0 24px;color:var(--muted)}
dl{margin:0 0 28px;font:13px/1.4 var(--mono);border-top:1px solid var(--line)}
dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
dt{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
dd{margin:0;color:#fff}
a.btn{display:inline-block;padding:13px 18px;background:var(--accent-bg);color:#fff;font:500 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;text-decoration:none}
a.btn:hover{background:#963816}
</style>
</head>
<body>
<main class="box">
  <span class="code">ERROR 404</span>
  <h1>Part not found.</h1>
  <p>This page doesn't exist or has moved.</p>
  <dl>
    <div><dt>Status</dt><dd>Out of tolerance</dd></div>
    <div><dt>Action</dt><dd>Return to home page</dd></div>
  </dl>
  <a class="btn" href="/">Back to serialtags.com →</a>
</main>
</body>
</html>
